name: wow-gold-research

on:
  # Run = push a change to wow_gold_scraper/RUN on this branch (workflow_dispatch needs the file on the default branch).
  push:
    branches: [claude/cool-goodall-00amud]
    paths: [wow_gold_scraper/RUN]
  workflow_dispatch:
    inputs:
      pages:
        description: "Fetch guide pages (robots.txt respected)"
        type: boolean
        default: true
      prices:
        description: "Pull live EU prices (needs BLIZZARD_CLIENT_ID/SECRET repo secrets)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wow_gold_scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wow_gold_scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Guide pages
        if: ${{ github.event_name == 'push' || inputs.pages }}
        continue-on-error: true
        run: python wowgold.py pages
      - name: Live EU prices
        if: ${{ github.event_name == 'push' || inputs.prices }}
        continue-on-error: true
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          if [ -z "$BLIZZARD_CLIENT_ID" ]; then echo "Blizzard secrets not set - skipping prices"; exit 0; fi
          python wowgold.py token
          python wowgold.py prices
      - name: Commit results back to this branch
        run: |
          git config user.name "wow-gold-research[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -f out
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "wow-gold-research results (run ${{ github.run_id }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
